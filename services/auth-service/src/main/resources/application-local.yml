server:
  port: 8081

spring:
  datasource:
    url: jdbc:postgresql://localhost:${POSTGRES_PORT:5434}/auth_db
    username: ${POSTGRES_USER:swiftdrop}
    password: ${POSTGRES_PASSWORD:swiftdrop_password}
    driver-class-name: org.postgresql.Driver
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:29092}
