spring:
  application:
    name: auth-service
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  mail:
    host: ${SPRING_MAIL_HOST:localhost}
    port: ${SPRING_MAIL_PORT:1025}

app:
  frontend:
    base-url: ${FRONTEND_BASE_URL:http://localhost:4200}

swiftdrop:
  security:
    oauth2:
      google:
        client-id: ${GOOGLE_CLIENT_ID:test-google-client-id}
        client-secret: ${GOOGLE_CLIENT_SECRET:test-google-client-secret}
        redirect-uri: ${GOOGLE_REDIRECT_URI:http://localhost/api/v1/auth/oauth2/callback/google}
        auth-url: ${GOOGLE_AUTH_URL:https://accounts.google.com/o/oauth2/v2/auth}
        token-url: ${GOOGLE_TOKEN_URL:https://oauth2.googleapis.com/token}
        frontend-callback-url: ${GOOGLE_FRONTEND_CALLBACK_URL:http://localhost:4200/auth/callback}
    internal:
      tokens:
        notifications-service: ${INTERNAL_NOTIFICATIONS_SERVICE_TOKEN:swiftdrop-internal-notif-secret-2026}
        merchant-service: ${INTERNAL_MERCHANT_SERVICE_TOKEN:swiftdrop-internal-merchant-secret-2026}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always
