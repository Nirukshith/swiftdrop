spring:
  application:
    name: operations-service
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always

swiftdrop:
  proofs:
    storage-dir: ${SWIFTDROP_PROOFS_STORAGE_DIR:/data/proofs}
    max-size-bytes: 5242880
  services:
    parcel-service:
      url: ${SWIFTDROP_SERVICES_PARCEL_SERVICE_URL:http://localhost:8082}
