spring:
  application:
    name: integration-service
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always

swiftdrop:
  assistant:
    llm-provider: ${ASSISTANT_PROVIDER:fake}
    model: ${LLM_MODEL:claude-3-5-haiku-latest}
    provider-url: ${LLM_PROVIDER_URL:https://api.anthropic.com}
    provider-timeout: ${LLM_PROVIDER_TIMEOUT:PT10S}
    upstream-timeout: ${ASSISTANT_UPSTREAM_TIMEOUT:PT3S}
  security:
    internal:
      tokens:
        notifications-service: ${INTERNAL_NOTIFICATIONS_SERVICE_TOKEN:swiftdrop-internal-notif-secret-2026}
        merchant-service: ${INTERNAL_MERCHANT_SERVICE_TOKEN:swiftdrop-internal-merchant-secret-2026}
        pricing-service: ${INTERNAL_PRICING_SERVICE_TOKEN:swiftdrop-internal-pricing-secret-2026}
