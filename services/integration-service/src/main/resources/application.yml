spring:
  application:
    name: integration-service
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  mail:
    host: ${SPRING_MAIL_HOST:localhost}
    port: ${SPRING_MAIL_PORT:1025}
    username: ${SPRING_MAIL_USERNAME:}
    password: ${SPRING_MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: ${SPRING_MAIL_PROPERTIES_MAIL_SMTP_AUTH:false}
          starttls:
            enable: ${SPRING_MAIL_PROPERTIES_MAIL_SMTP_STARTTLS_ENABLE:false}
            required: ${SPRING_MAIL_PROPERTIES_MAIL_SMTP_STARTTLS_REQUIRED:false}
          ssl:
            trust: ${SPRING_MAIL_PROPERTIES_MAIL_SMTP_SSL_TRUST:*}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always

swiftdrop:
  merchant:
    credentials:
      handoff-encryption-key: ${MERCHANT_CREDENTIAL_HANDOFF_ENCRYPTION_KEY:}
  assistant:
    llm-provider: ${ASSISTANT_PROVIDER:fake}
    model: ${LLM_MODEL:claude-3-5-haiku-latest}
    provider-url: ${LLM_PROVIDER_URL:https://api.anthropic.com}
    provider-timeout: ${LLM_PROVIDER_TIMEOUT:PT10S}
    upstream-timeout: ${ASSISTANT_UPSTREAM_TIMEOUT:PT3S}
    rate-limit:
      max-requests: ${ASSISTANT_RATE_LIMIT_MAX_REQUESTS:10}
      window: ${ASSISTANT_RATE_LIMIT_WINDOW:PT1M}
  security:
    internal:
      tokens:
        notifications-service: ${INTERNAL_NOTIFICATIONS_SERVICE_TOKEN:swiftdrop-internal-notif-secret-2026}
        merchant-service: ${INTERNAL_MERCHANT_SERVICE_TOKEN:swiftdrop-internal-merchant-secret-2026}
        pricing-service: ${INTERNAL_PRICING_SERVICE_TOKEN:swiftdrop-internal-pricing-secret-2026}
