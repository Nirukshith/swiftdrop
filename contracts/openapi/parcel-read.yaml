openapi: 3.0.3
info:
  title: SwiftDrop Parcel Service - Tracking, History, Receipt and Rating API
  version: 0.1.0-SNAPSHOT
  description: |
    Read-side contract for parcel-service (Port 8082), owned by Member M2
    (`tracking` and `receipt` packages). Covers the public masked tracking
    lookup, the public Server-Sent Events stream, the per-parcel status
    history, the PDF receipt, and the delivery rating (+).

    Parcel lifecycle, creation, cancellation and the customer parcel list are
    owned by M1 in `contracts/openapi/parcel.yaml`; shared schemas below are
    copied from that file and must stay identical to it.

    Design notes and open questions: `docs/tracking-design.md`.
servers:
  - url: http://localhost:8082
    description: Local development parcel-service
tags:
  - name: Public tracking
    description: No login. Masked data only (CU-06, CU-04).
  - name: Customer
    description: Authenticated customer views (CU-05, CU-07).
paths:
  # =========================================================================
  # Public tracking (no authentication, rate limited at the gateway)
  # =========================================================================
  /api/v1/tracking/{trackingNo}:
    get:
      tags: [Public tracking]
      summary: Public masked tracking lookup
      description: |
        Returns the current status and status timeline of a parcel by its public
        tracking number. No login is required, so the response is masked: the
        recipient name is masked and no phone number, street address, city,
        postal code, notes, fee, proof or internal identifiers are returned.
        Unknown and malformed tracking numbers both return 404 so the endpoint
        cannot be used to probe which numbers exist.
      operationId: getPublicTracking
      security: []
      parameters:
        - $ref: '#/components/parameters/TrackingNo'
      responses:
        '200':
          description: Masked tracking view
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicTrackingResponse'
        '404':
          $ref: '#/components/responses/TrackingNotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /api/v1/tracking/{trackingNo}/stream:
    get:
      tags: [Public tracking]
      summary: Live public tracking stream (SSE)
      description: |
        Long-lived `text/event-stream` connection that pushes status changes for
        one parcel. Each event's `id` is the parcel's ADR 005 `sequence`, so a
        reconnecting client sends `Last-Event-ID` and receives only the status
        changes it missed. Sequences are monotonic but not contiguous (courier
        assignment also increments them), so clients must not treat gaps as
        lost events and must ignore any event whose id is not greater than the
        last one seen.

        Frames sent by the server:
        - `retry: 5000` once, at connect.
        - `event: status` with a `PublicTrackingEvent` JSON body, for the
          current state at connect (or every missed change when
          `Last-Event-ID` is sent) and for every later change.
        - `: heartbeat` comment every 15 seconds to keep proxies from closing
          an idle connection. Comments are ignored by `EventSource`.

        The server completes the stream after the parcel reaches a terminal
        status (`DELIVERED`, `CANCELLED`), or after 30 minutes, after which the
        browser reconnects with `Last-Event-ID`. `FAILED` does not close the
        stream because a dispatcher may re-queue the parcel.
      operationId: streamPublicTracking
      security: []
      parameters:
        - $ref: '#/components/parameters/TrackingNo'
        - name: Last-Event-ID
          in: header
          required: false
          description: Sequence of the last event the client received. Set automatically by `EventSource` on reconnect.
          schema:
            type: integer
            format: int64
            minimum: 0
            example: 4
      responses:
        '200':
          description: Event stream opened
          headers:
            Cache-Control:
              schema:
                type: string
                example: no-cache
            X-Accel-Buffering:
              description: Tells Nginx not to buffer this response.
              schema:
                type: string
                example: "no"
          content:
            text/event-stream:
              schema:
                type: string
                description: SSE frames whose `data` lines carry `PublicTrackingEvent` JSON.
              example: |
                retry: 5000

                id: 4
                event: status
                data: {"trackingNumber":"SD-20261026-A1B2C3","sequence":4,"status":"OUT_FOR_DELIVERY","occurredAt":"2026-10-26T09:30:00Z"}

                : heartbeat

        '404':
          $ref: '#/components/responses/TrackingNotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'

  # =========================================================================
  # Authenticated parcel views (M2 sub-resources of M1's /api/v1/parcels/{id})
  # =========================================================================
  /api/v1/parcels/{id}/history:
    get:
      tags: [Customer]
      summary: Parcel status history (timeline)
      description: |
        Full status timeline of one parcel, oldest first, built from
        `parcel.status-changed.v1` events plus the creation time. Used by the
        parcel detail page before it opens the live stream.

        Access follows the same rule as M1's `GET /api/v1/parcels/{id}`:
        owner customer, assigned courier, DISPATCHER or ADMIN.

        The list of a customer's deliveries (CU-05 "history table") is M1's
        `GET /api/v1/parcels`; see open question Q2 in
        `docs/tracking-design.md` about its filters.
      operationId: getParcelHistory
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ParcelId'
      responses:
        '200':
          description: Status timeline
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ParcelHistoryResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v1/parcels/{id}/receipt:
    get:
      tags: [Customer]
      summary: Download PDF receipt
      description: |
        Generates the parcel receipt as a PDF with OpenPDF (CU-05). Available to
        the owner customer and ADMIN. Which statuses allow a receipt is open
        question Q5.
      operationId: downloadParcelReceipt
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ParcelId'
      responses:
        '200':
          description: PDF receipt
          headers:
            Content-Disposition:
              schema:
                type: string
                example: attachment; filename="receipt-SD-20261026-A1B2C3.pdf"
          content:
            application/pdf:
              schema:
                type: string
                format: binary
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v1/parcels/{id}/rating:
    post:
      tags: [Customer]
      summary: Rate a delivered parcel (+)
      description: |
        Should-have (CU-07, deferred by ADR 006 until Must-haves are done).
        Only the owner customer may rate, only when the parcel is `DELIVERED`,
        and only once per parcel. The request body is a proposal: the SRS does
        not define it (open question Q6).
      operationId: rateParcel
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ParcelId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateRatingRequest'
      responses:
        '201':
          description: Rating stored
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RatingResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Parcel is not delivered, or has already been rated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                notDelivered:
                  value:
                    code: "PARCEL_NOT_DELIVERED"
                    message: "Only delivered parcels can be rated; current status is OUT_FOR_DELIVERY"
                    correlationId: "5d0c6c2e-8a51-4f0e-9a43-2b6f1d7f3c10"
                    timestamp: "2026-10-26T12:00:00Z"
                alreadyRated:
                  value:
                    code: "RATING_ALREADY_EXISTS"
                    message: "Parcel SD-20261026-A1B2C3 has already been rated"
                    correlationId: "5d0c6c2e-8a51-4f0e-9a43-2b6f1d7f3c10"
                    timestamp: "2026-10-26T12:00:00Z"

    get:
      tags: [Customer]
      summary: Get the rating of a parcel (+)
      description: Returns the stored rating so the UI can show it instead of the rating form. Owner customer or ADMIN.
      operationId: getParcelRating
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ParcelId'
      responses:
        '200':
          description: Stored rating
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RatingResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: Parcel not found, or not rated yet
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                code: "RESOURCE_NOT_FOUND"
                message: "No rating found for parcel 7e9b3a24-c189-4b68-b7c1-fa9e6a0d2f11"
                correlationId: "c8192841-4912-4819-b128-481928419028"
                timestamp: "2026-10-26T12:00:00Z"

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    TrackingNo:
      name: trackingNo
      in: path
      required: true
      description: Public tracking number (`SD-YYYYMMDD-XXXXXX`).
      schema:
        type: string
        pattern: '^SD-\d{8}-[A-Z0-9]{6}$'
        example: "SD-20261026-A1B2C3"
    ParcelId:
      name: id
      in: path
      required: true
      description: Parcel UUID
      schema:
        type: string
        format: uuid
        example: "7e9b3a24-c189-4b68-b7c1-fa9e6a0d2f11"

  responses:
    TrackingNotFound:
      description: No parcel with this tracking number (also returned for malformed numbers)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            code: "RESOURCE_NOT_FOUND"
            message: "No parcel found for this tracking number"
            correlationId: "0f7b2b1e-6c55-4a43-8f0e-6a2d1c9b7e21"
            timestamp: "2026-10-26T12:00:00Z"

    TooManyRequests:
      description: Rate limit exceeded at the gateway
      headers:
        Retry-After:
          description: Seconds to wait before retrying
          schema:
            type: integer
            example: 30
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            code: "TOO_MANY_REQUESTS"
            message: "Too many tracking requests, please retry later"
            correlationId: "a7c3e9d2-1b4f-4e6a-9c8d-3f2e1a0b9c87"
            timestamp: "2026-10-26T12:00:00Z"

    BadRequest:
      description: Invalid request parameters or payload validation failure
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            code: "VALIDATION_FAILED"
            message: "score must be between 1 and 5"
            correlationId: "d19284fa-3891-49b2-a812-491029418290"
            timestamp: "2026-10-26T12:00:00Z"

    Unauthorized:
      description: Missing, invalid, or expired JWT token
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            code: "UNAUTHORIZED"
            message: "Full authentication is required to access this resource"
            correlationId: "a1892041-5819-4821-9812-481928410928"
            timestamp: "2026-10-26T12:00:00Z"

    Forbidden:
      description: Access denied for the authenticated user or role
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            code: "ACCESS_DENIED"
            message: "User does not hold the required permissions for this action"
            correlationId: "b8912481-4912-4819-a128-481928419028"
            timestamp: "2026-10-26T12:00:00Z"

    NotFound:
      description: Target resource was not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            code: "RESOURCE_NOT_FOUND"
            message: "Parcel not found with ID 7e9b3a24-c189-4b68-b7c1-fa9e6a0d2f11"
            correlationId: "c8192841-4912-4819-b128-481928419028"
            timestamp: "2026-10-26T12:00:00Z"

  schemas:
    # -----------------------------------------------------------------------
    # Public tracking (masked)
    # -----------------------------------------------------------------------
    PublicTrackingResponse:
      type: object
      description: |
        Everything the public page may show. Adding a field here needs a
        masking review (see `docs/tracking-design.md`, section 2).
      required:
        - trackingNumber
        - status
        - recipientNameMasked
        - dropoffDistrict
        - lastUpdatedAt
        - timeline
      properties:
        trackingNumber:
          type: string
          example: "SD-20261026-A1B2C3"
        status:
          $ref: '#/components/schemas/ParcelStatus'
        recipientNameMasked:
          type: string
          description: First letter of each name part followed by `***` (format is open question Q3).
          example: "S*** S***"
        dropoffDistrict:
          $ref: '#/components/schemas/District'
        lastUpdatedAt:
          type: string
          format: date-time
          example: "2026-10-26T09:30:00Z"
        timeline:
          type: array
          description: Status changes, oldest first. No reasons, courier or actor data.
          items:
            $ref: '#/components/schemas/PublicTimelineEntry'

    PublicTimelineEntry:
      type: object
      required: [status, occurredAt]
      properties:
        status:
          $ref: '#/components/schemas/ParcelStatus'
        occurredAt:
          type: string
          format: date-time
          example: "2026-10-26T08:05:00Z"

    PublicTrackingEvent:
      type: object
      description: Body of an SSE `status` event. Masked like `PublicTrackingResponse`.
      required: [trackingNumber, sequence, status, occurredAt]
      properties:
        trackingNumber:
          type: string
          example: "SD-20261026-A1B2C3"
        sequence:
          type: integer
          format: int64
          description: ADR 005 per-parcel sequence; also used as the SSE event id.
          example: 4
        status:
          $ref: '#/components/schemas/ParcelStatus'
        occurredAt:
          type: string
          format: date-time
          example: "2026-10-26T09:30:00Z"

    # -----------------------------------------------------------------------
    # Authenticated history
    # -----------------------------------------------------------------------
    ParcelHistoryResponse:
      type: object
      required: [parcelId, trackingNumber, currentStatus, entries]
      properties:
        parcelId:
          type: string
          format: uuid
          example: "7e9b3a24-c189-4b68-b7c1-fa9e6a0d2f11"
        trackingNumber:
          type: string
          example: "SD-20261026-A1B2C3"
        currentStatus:
          $ref: '#/components/schemas/ParcelStatus'
        entries:
          type: array
          description: Oldest first. The first entry is the creation (`fromStatus` null, `toStatus` CREATED).
          items:
            $ref: '#/components/schemas/ParcelHistoryEntry'

    ParcelHistoryEntry:
      type: object
      description: One status change, taken from the `parcel.status-changed.v1` envelope.
      required: [sequence, toStatus, occurredAt]
      properties:
        sequence:
          type: integer
          format: int64
          example: 4
        fromStatus:
          allOf:
            - $ref: '#/components/schemas/ParcelStatus'
          nullable: true
          example: "IN_TRANSIT"
        toStatus:
          $ref: '#/components/schemas/ParcelStatus'
        occurredAt:
          type: string
          format: date-time
          example: "2026-10-26T09:30:00Z"
        reason:
          type: string
          nullable: true
          description: Failure or cancellation reason from the event, if any.
          example: null

    # -----------------------------------------------------------------------
    # Rating (+) - proposed shape, see open question Q6
    # -----------------------------------------------------------------------
    CreateRatingRequest:
      type: object
      required: [score]
      properties:
        score:
          type: integer
          minimum: 1
          maximum: 5
          example: 5
        comment:
          type: string
          nullable: true
          maxLength: 500
          example: "Courier was on time and polite"

    RatingResponse:
      type: object
      required: [parcelId, score, createdAt]
      properties:
        parcelId:
          type: string
          format: uuid
          example: "7e9b3a24-c189-4b68-b7c1-fa9e6a0d2f11"
        score:
          type: integer
          minimum: 1
          maximum: 5
          example: 5
        comment:
          type: string
          nullable: true
          example: "Courier was on time and polite"
        createdAt:
          type: string
          format: date-time
          example: "2026-10-26T15:00:00Z"

    # -----------------------------------------------------------------------
    # Copied from contracts/openapi/parcel.yaml (M1) - keep in sync
    # -----------------------------------------------------------------------
    ParcelStatus:
      type: string
      description: Canonical state machine status
      enum:
        - CREATED
        - PICKED_UP
        - IN_TRANSIT
        - OUT_FOR_DELIVERY
        - DELIVERED
        - FAILED
        - CANCELLED
      example: "CREATED"

    District:
      type: string
      description: Predefined administrative districts of Sri Lanka per ADR 002
      enum:
        - Ampara
        - Anuradhapura
        - Badulla
        - Batticaloa
        - Colombo
        - Galle
        - Gampaha
        - Hambantota
        - Jaffna
        - Kalutara
        - Kandy
        - Kegalle
        - Kilinochchi
        - Kurunegala
        - Mannar
        - Matale
        - Matara
        - Monaragala
        - Mullaitivu
        - Nuwara Eliya
        - Polonnaruwa
        - Puttalam
        - Ratnapura
        - Trincomalee
        - Vavuniya
      example: "Colombo"

    ErrorResponse:
      type: object
      required:
        - code
        - message
        - correlationId
        - timestamp
      properties:
        code:
          type: string
          description: Standard application error code
          example: "RESOURCE_NOT_FOUND"
        message:
          type: string
          description: Human-readable error details
          example: "Parcel not found with ID 7e9b3a24-c189-4b68-b7c1-fa9e6a0d2f11"
        correlationId:
          type: string
          description: Tracing correlation ID propagated via X-Correlation-Id header
          example: "c4b9d031-1e9a-4d4b-97e2-45e0a6d96e51"
        timestamp:
          type: string
          format: date-time
          example: "2026-10-26T12:00:00Z"
