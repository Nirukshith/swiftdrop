name: CI

on:
  push:
    branches:
      - main
      - development
  pull_request:
    branches:
      - main
      - development

jobs:
  backend:
    name: Backend CI
    runs-on: ubuntu-latest
    env:
      TESTCONTAINERS_RYUK_DISABLED: 'true'
      DOCKER_HOST: unix:///var/run/docker.sock
      DOCKER_API_VERSION: '1.44'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Temurin JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'maven'

      - name: Configure Docker socket & client API version
        run: |
          sudo chmod 666 /var/run/docker.sock
          echo "api.version=1.44" > ~/.docker-java.properties
          docker pull postgres:16-alpine

      - name: Run Maven verify
        run: mvn -B verify -DtrimStackTrace=false

      - name: Generate merged backend JaCoCo report
        shell: bash
        run: |
          set -euo pipefail
          mvn -B org.apache.maven.plugins:maven-dependency-plugin:3.8.1:get \
            "-Dartifact=org.jacoco:org.jacoco.cli:0.8.12:jar:nodeps" \
            -Dtransitive=false

          jacoco_cli="$HOME/.m2/repository/org/jacoco/org.jacoco.cli/0.8.12/org.jacoco.cli-0.8.12-nodeps.jar"
          test -f "$jacoco_cli"

          exec_files=(
            common/target/jacoco.exec
            services/auth-service/target/jacoco.exec
            services/parcel-service/target/jacoco.exec
            services/operations-service/target/jacoco.exec
            services/integration-service/target/jacoco.exec
          )
          class_files=(
            common/target/classes
            services/auth-service/target/classes
            services/parcel-service/target/classes
            services/operations-service/target/classes
            services/integration-service/target/classes
          )
          source_files=(
            common/src/main/java
            services/auth-service/src/main/java
            services/parcel-service/src/main/java
            services/operations-service/src/main/java
            services/integration-service/src/main/java
          )

          for file in "${exec_files[@]}"; do test -f "$file"; done
          for directory in "${class_files[@]}" "${source_files[@]}"; do test -d "$directory"; done

          mkdir -p target/site/jacoco-aggregate
          java -jar "$jacoco_cli" merge "${exec_files[@]}" \
            --destfile target/jacoco-merged.exec
          java -jar "$jacoco_cli" report target/jacoco-merged.exec \
            --classfiles "${class_files[0]}" \
            --classfiles "${class_files[1]}" \
            --classfiles "${class_files[2]}" \
            --classfiles "${class_files[3]}" \
            --classfiles "${class_files[4]}" \
            --sourcefiles "${source_files[0]}" \
            --sourcefiles "${source_files[1]}" \
            --sourcefiles "${source_files[2]}" \
            --sourcefiles "${source_files[3]}" \
            --sourcefiles "${source_files[4]}" \
            --html target/site/jacoco-aggregate \
            --xml target/site/jacoco-aggregate/jacoco.xml \
            --csv target/site/jacoco-aggregate/jacoco.csv

          test -s target/site/jacoco-aggregate/index.html
          test -s target/site/jacoco-aggregate/jacoco.xml

      - name: Dump Surefire test logs on failure
        if: failure()
        run: tail -n 100 services/*/target/surefire-reports/*.txt

      - name: Upload merged backend coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: |
            target/site/jacoco-aggregate
          if-no-files-found: warn

  docker-images:
    name: Docker image builds
    runs-on: ubuntu-latest
    needs: backend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build core Docker images without pushing
        run: docker compose -f deploy/docker-compose.yml --profile core build

  frontend:
    name: Frontend CI
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js from .nvmrc
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install, test, and build frontend
        run: npm ci && npm test -- --ci --coverage && npm run build

      - name: Upload frontend coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-coverage
          path: frontend/coverage
          if-no-files-found: warn
