name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  backend:
    name: Backend CI
    runs-on: ubuntu-latest
    env:
      TESTCONTAINERS_RYUK_DISABLED: 'true'
      DOCKER_HOST: unix:///var/run/docker.sock
      DOCKER_API_VERSION: '1.44'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Temurin JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'maven'

      - name: Configure Docker socket & client API version
        run: |
          sudo chmod 666 /var/run/docker.sock
          echo "api.version=1.44" > ~/.docker-java.properties
          docker pull postgres:16-alpine

      - name: Run Maven verify
        run: mvn -B verify -DtrimStackTrace=false

      - name: Dump Surefire test logs on failure
        if: failure()
        run: tail -n 100 services/*/target/surefire-reports/*.txt

      - name: Upload merged backend coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: |
            target/site/jacoco-aggregate
            services/*/target/site/jacoco
          if-no-files-found: warn

  frontend:
    name: Frontend CI
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js from .nvmrc
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install, test, and build frontend
        run: npm ci && npm test -- --ci --coverage && npm run build

      - name: Upload frontend coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-coverage
          path: frontend/coverage
          if-no-files-found: warn
