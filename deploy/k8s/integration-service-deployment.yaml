apiVersion: apps/v1
kind: Deployment
metadata:
  name: integration-service
  namespace: swiftdrop
  labels:
    app.kubernetes.io/name: integration-service
    app.kubernetes.io/part-of: swiftdrop
spec:
  replicas: 1
  selector:
    matchLabels:
      app: integration-service
  template:
    metadata:
      labels:
        app: integration-service
        app.kubernetes.io/name: integration-service
        app.kubernetes.io/part-of: swiftdrop
    spec:
      containers:
        - name: integration-service
          image: swiftdrop/integration-service:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 8084
          env:
            - name: SPRING_PROFILES_ACTIVE
              value: "local"
            - name: SPRING_DATASOURCE_URL
              value: "jdbc:postgresql://postgres:5432/integration_db"
            - name: SPRING_DATASOURCE_USERNAME
              valueFrom:
                configMapKeyRef:
                  name: swiftdrop-config
                  key: POSTGRES_USER
            - name: SPRING_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: swiftdrop-secrets
                  key: POSTGRES_PASSWORD
            - name: SPRING_KAFKA_BOOTSTRAP_SERVERS
              valueFrom:
                configMapKeyRef:
                  name: swiftdrop-config
                  key: KAFKA_BOOTSTRAP_SERVERS
            - name: JWKS_URL
              valueFrom:
                configMapKeyRef:
                  name: swiftdrop-config
                  key: JWKS_URL
            - name: INTERNAL_NOTIFICATIONS_SERVICE_TOKEN
              valueFrom:
                secretKeyRef:
                  name: swiftdrop-secrets
                  key: INTERNAL_NOTIFICATIONS_SERVICE_TOKEN
            - name: INTERNAL_MERCHANT_SERVICE_TOKEN
              valueFrom:
                secretKeyRef:
                  name: swiftdrop-secrets
                  key: INTERNAL_MERCHANT_SERVICE_TOKEN
            - name: SPRING_MAIL_HOST
              valueFrom:
                configMapKeyRef:
                  name: swiftdrop-config
                  key: SPRING_MAIL_HOST
            - name: SPRING_MAIL_PORT
              valueFrom:
                configMapKeyRef:
                  name: swiftdrop-config
                  key: SPRING_MAIL_PORT
          resources:
            requests:
              memory: "384Mi"
              cpu: "200m"
            limits:
              memory: "600Mi"
              cpu: "1000m"
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8084
            initialDelaySeconds: 30
            periodSeconds: 10
            failureThreshold: 12
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8084
            initialDelaySeconds: 60
            periodSeconds: 15
---
apiVersion: v1
kind: Service
metadata:
  name: integration-service
  namespace: swiftdrop
  labels:
    app.kubernetes.io/name: integration-service
    app.kubernetes.io/part-of: swiftdrop
spec:
  selector:
    app: integration-service
  ports:
    - port: 8084
      targetPort: 8084

