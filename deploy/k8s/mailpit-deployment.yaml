apiVersion: apps/v1
kind: Deployment
metadata:
  name: mailpit
  namespace: swiftdrop
  labels:
    app.kubernetes.io/name: mailpit
    app.kubernetes.io/part-of: swiftdrop
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mailpit
  template:
    metadata:
      labels:
        app: mailpit
        app.kubernetes.io/name: mailpit
        app.kubernetes.io/part-of: swiftdrop
    spec:
      containers:
        - name: mailpit
          image: axllent/mailpit:v1.32.0
          ports:
            - containerPort: 1025
              name: smtp
            - containerPort: 8025
              name: ui
          env:
            - name: MP_MAX_MESSAGES
              value: "500"
          resources:
            requests:
              memory: "64Mi"
              cpu: "50m"
            limits:
              memory: "128Mi"
              cpu: "200m"
          readinessProbe:
            httpGet:
              path: /readyz
              port: 8025
            initialDelaySeconds: 5
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: mailpit
  namespace: swiftdrop
  labels:
    app.kubernetes.io/name: mailpit
    app.kubernetes.io/part-of: swiftdrop
spec:
  selector:
    app: mailpit
  ports:
    - name: smtp
      port: 1025
      targetPort: 1025
    - name: ui
      port: 8025
      targetPort: 8025

