# ============================================================
# SwiftDrop Kubernetes Secret – PLACEHOLDER VALUES ONLY
# ============================================================
# NEVER commit real secrets to source control.
#
# How to apply with real values:
#   1. Base64-encode each value:
#        echo -n 'my-real-password' | base64
#   2. Replace every <base64-encoded-...> placeholder below.
#   3. Apply to the cluster:
#        kubectl apply -f secrets.yaml -n swiftdrop
#
# Alternatively, create the Secret imperatively:
#   kubectl create secret generic swiftdrop-secrets \
#     --namespace=swiftdrop \
#     --from-literal=POSTGRES_PASSWORD='your-db-password' \
#     --from-literal=INTERNAL_NOTIFICATIONS_SERVICE_TOKEN='your-notif-token' \
#     --from-literal=INTERNAL_MERCHANT_SERVICE_TOKEN='your-merchant-token' \
#     --from-literal=GOOGLE_CLIENT_ID='your-google-client-id' \
#     --from-literal=GOOGLE_CLIENT_SECRET='your-google-client-secret' \
#     --dry-run=client -o yaml | kubectl apply -f -
# ============================================================
apiVersion: v1
kind: Secret
metadata:
  name: swiftdrop-secrets
  namespace: swiftdrop
  labels:
    app.kubernetes.io/part-of: swiftdrop
type: Opaque
data:
  # echo -n 'your-db-password' | base64
  POSTGRES_PASSWORD: <base64-encoded-postgres-password>

  # Internal service token (shared between auth-service and integration-service)
  INTERNAL_NOTIFICATIONS_SERVICE_TOKEN: <base64-encoded-notif-token>
  INTERNAL_MERCHANT_SERVICE_TOKEN: <base64-encoded-merchant-token>

  # Google OAuth 2.0 credentials (obtain from Google Cloud Console)
  GOOGLE_CLIENT_ID: <base64-encoded-google-client-id>
  GOOGLE_CLIENT_SECRET: <base64-encoded-google-client-secret>

