events {}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    upstream auth_service {
        server auth-service:8081;
    }

    upstream parcel_service {
        server host.docker.internal:8082;
    }

    upstream operations_service {
        server host.docker.internal:8083;
    }

    upstream integration_service {
        server host.docker.internal:8084;
    }

    upstream frontend_service {
        server frontend:80;
    }

    server {
        listen 80;
        server_name _;

        proxy_set_header Host $host;

        # Internal service-to-service APIs are never exposed by the gateway.
        location ^~ /internal/ {
            return 404;
        }

        location = /health {
            access_log off;
            return 200 "ok\n";
        }

        location /.well-known/jwks.json {
            proxy_pass http://auth_service;
        }

        location /api/v1/auth {
            proxy_pass http://auth_service;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            # Replace any client-provided chain; auth-service uses the first value.
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /api/v1/admin/users {
            proxy_pass http://auth_service;
        }

        location /api/v1/parcels {
            proxy_pass http://parcel_service;
        }

        location ^~ /api/v1/tracking {
            proxy_pass http://parcel_service;
            proxy_http_version 1.1;
            proxy_buffering off;
            proxy_read_timeout 1h;
            proxy_send_timeout 1h;
        }

        location /api/v1/addresses {
            proxy_pass http://parcel_service;
        }

        # The plan does not name a separate SSE endpoint; tracking is the
        # existing frontend route carrying the long-lived status stream.
        location /tracking {
            proxy_pass http://parcel_service;
            proxy_http_version 1.1;
            proxy_buffering off;
            proxy_read_timeout 1h;
            proxy_send_timeout 1h;
        }

        location /addresses {
            proxy_pass http://parcel_service;
        }

        location /api/v1/dispatch {
            proxy_pass http://operations_service;
        }

        location /api/v1/admin/zones {
            proxy_pass http://operations_service;
        }

        location /api/v1/admin/pricing-rules {
            proxy_pass http://operations_service;
        }

        location /api/v1/admin/reports {
            proxy_pass http://operations_service;
        }

        # Courier APIs live under /api/v1/courier. Keep the complete URI so
        # operations-service receives the contract path unchanged.
        location ^~ /api/v1/courier {
            proxy_pass http://operations_service;
            proxy_set_header Authorization $http_authorization;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /courier {
            proxy_pass http://operations_service;
        }

        location /admin/zones {
            proxy_pass http://operations_service;
        }

        location /admin/pricing-rules {
            proxy_pass http://operations_service;
        }

        location /admin/reports {
            proxy_pass http://operations_service;
        }

        location /api/v1/merchants {
            proxy_pass http://integration_service;
        }

        location /api/v1/merchant {
            proxy_pass http://integration_service;
        }

        location /api/v1/admin/merchants {
            proxy_pass http://integration_service;
        }

        location /api/v1/assistant {
            proxy_pass http://integration_service;
        }

        location /api/v1/notifications {
            proxy_pass http://integration_service;
        }

        location /merchant {
            proxy_pass http://integration_service;
        }

        location /admin/merchants {
            proxy_pass http://integration_service;
        }

        location /assistant {
            proxy_pass http://integration_service;
        }

        location /notifications {
            proxy_pass http://integration_service;
        }

        location / {
            proxy_pass http://frontend_service;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
